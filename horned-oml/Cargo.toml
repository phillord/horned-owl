[package]
name = "horned-oml"
version = "0.1.0"
authors = ["Phillip Lord"]
description = "Reader for the Ontological Modeling Language (OML), mapped to OWL, for horned-owl"
repository = "https://github.com/phillord/horned-owl"
edition = "2024"
license = "LGPL-3.0"

[dependencies]
horned-owl = { path = "../", version = ">=4.0.0, <6" }
horned-catalog = { workspace = true }
pest = "2.7.8"
pest_derive = "2.7.8"
curie = "0.1.1"
thiserror = "1.0"
clap = { version = "3.2.2", optional = true }
oxrdfio = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.7.0"
tempfile = "3"

[[bench]]
name = "read"
harness = false

[features]
default = ["cli"]
# The command line tools.
cli = ["dep:clap", "dep:oxrdfio"]

[[bin]]
name = "horned-oml2owl"
path = "src/bin/horned_oml2owl.rs"
required-features = ["cli"]

[[bin]]
name = "horned-owl2oml"
path = "src/bin/horned_owl2oml.rs"
required-features = ["cli"]
