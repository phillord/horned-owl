[package]
name = "horned-pretty-rdf"
version = "0.13.0"
authors = ["Phillip Lord"]
repository = "https://github.com/phillord/horned-owl"
description = "RDF/XML Pretty Formatting"

edition = "2024"
license = "LGPL-3.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
indexmap = "1.*"
quick-xml = "0.31.0"
oxrdf= "0.3.1"
oxrdfio= "0.2.1"
rustc-hash = "1"

[dev-dependencies]
oxiri="0.2.1"
pretty_assertions = "1.*"
oxrdfio= "0.2.1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pretty_rdf_bench"
harness = false
