[package]
name = "horned-roundtrip"
version = "0.1.0"
edition = "2021"

[dependencies]
horned-owl = { git = "https://github.com/phillord/horned-owl.git", rev = "0a9debdbf85243350d3d6edc0dcd617f0ed47d97" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
anyhow = "1"
flate2 = "1"
rayon = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[profile.release]
panic = "unwind"
