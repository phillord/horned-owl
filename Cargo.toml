[package]
name = "horned-roundtrip"
version = "0.1.0"
edition = "2021"

[dependencies]
horned-owl = { git = "https://github.com/phillord/horned-owl.git", rev = "0a9debdbf85243350d3d6edc0dcd617f0ed47d97" }
# horned_owl::io re-exports PrefixMapping only via a private `use curie::
# PrefixMapping;` (see io/mod.rs), so it is not reachable as
# `horned_owl::io::PrefixMapping`. Depend on the same `curie` crate directly
# (pinned to the version horned-owl's Cargo.lock resolves) to name the type.
curie = "0.1.4"
# horned-owl's RDF reader takes the input syntax via
# `ParserConfiguration.rdf.format: Option<oxrdfio::RdfFormat>` (defaults to
# RdfXml). Depend on the same oxrdfio to name `RdfFormat::Turtle` so we can
# route Turtle/N-Triples sources through the (oxrdfio-backed) RDF reader.
oxrdfio = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
anyhow = "1"
flate2 = "1"
rayon = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[profile.release]
panic = "unwind"
