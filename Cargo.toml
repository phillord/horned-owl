[workspace.package]
version = "2.1.0"

[package]
name = "horned-owl"
version.workspace = true
authors = ["Phillip Lord <phillip.lord@russet.org.uk>"]
description = "Library for OWL Ontologies"

repository = "https://github.com/phillord/horned-owl"

keywords = ["xml", "ontology", "OWL", "command"]
categories = ["command-line-utilities", "parsing",
              "rendering", "science", "data-structures"]

license = "LGPL-3.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
curie = "0.1.1"
enum_meta = "0.6.0"
thiserror = "1.0"
lazy_static="1.4.0"
log = {version="0.4.8"}
quick-xml={version="0.37.5"}
indexmap={workspace=true}
oxiri={workspace=true}
pest = "2.7.8"
pest_derive = "2.7.8"
horned-pretty-rdf={workspace=true}
horned-catalog={workspace=true}
oxrdf={workspace=true}
oxrdfio={workspace=true}
ureq={version="3.3.0", optional=true}

[workspace]
members=["horned-bin", "horned-pretty-rdf", "horned-catalog", "horned-macro", "horned-profile"]
default-members=[".", "horned-bin", "horned-pretty-rdf", "horned-catalog", "horned-macro", "horned-profile"]

[workspace.dependencies]
indexmap="1.0.2"
mktemp="0.5.1"
oxiri="0.2.11"
horned-pretty-rdf={path="./horned-pretty-rdf", version="2.0.1"}
horned-catalog={path="./horned-catalog", version="1.0.0"}
horned-macro={path="./horned-macro", version="2.1.0"}
horned-profile={path="./horned-profile", version="2.1.0"}
oxrdf="0.3.0"
oxrdfio="0.2.0"

[features]
default = ["remote"]
remote = ["ureq"]
encoding = ["quick-xml/encoding"]

[dev-dependencies]
proptest = "1"
horned-owl = {path=".", features = ["remote"]}
criterion = "0.7.0"
mktemp = {workspace = true}
pretty_assertions = "1.0.0"
slurp = "1.0.1"
rstest = "0.23"
horned-bin = {path="horned-bin"}
horned-macro = {workspace = true}

[profile.release]
debug = true

[[bench]]
name = "horned"
harness = false

